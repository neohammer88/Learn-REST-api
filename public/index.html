<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>REST API project1</title>

</head>

<body>

<h1>Testing Like</h1>


<!-- ==========================
     Login
=========================== -->

<h3>User login</h3>

<select id="userSelect">

    <option value="1">
        Tom
    </option>

    <option value="2">
        Jane
    </option>

    <option value="3">
        Michael
    </option>

</select>


<button id="loginButton">
    Login
</button>


<p>

Current User:

<strong id="currentUser">
Not logged in
</strong>

</p>


<hr>


<!-- ==========================
     Post
=========================== -->

<h2>I like Pizza 🍕</h2>


<button id="likeButton" disabled>

    👍 Like

</button>


<span>

Like

<strong id="likeCount">
0
</strong>

</span>


<script>


// Current user ID

let currentUserId = null;


// Current post like status

let liked = false;


// Post ID

const postId = 1;


// =====================================
// Login
// =====================================

async function login() {

    const userId =
        Number(
            document.getElementById(
                "userSelect"
            ).value
        );


    const response =
        await fetch(
            "/api/login",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    userId: userId
                })

            }
        );


    const data =
        await response.json();


    currentUserId =
        data.userId;


    document.getElementById(
        "currentUser"
    ).textContent =
        data.name;


    document.getElementById(
        "likeButton"
    ).disabled = false;


    // User logged in, load post info

    loadPost();

}


// =====================================
// Get post info
// =====================================

async function loadPost() {

    const response =
        await fetch(
            `/api/posts/${postId}?userId=${currentUserId}`
        );


    const data =
        await response.json();


    liked =
        data.liked;


    document.getElementById(
        "likeCount"
    ).textContent =
        data.likeCount;


    updateButton();

}


// =====================================
// Like button
// =====================================

async function toggleLike() {

    if (!currentUserId) {

        alert("Login first.");

        return;

    }


    let response;


    // Cancel like
    if (liked) {

        response =
            await fetch(
                `/api/posts/${postId}/like`,
                {

                    method: "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        userId:
                            currentUserId

                    })

                }
            );

    }


    // Like
    else {

        response =
            await fetch(
                `/api/posts/${postId}/like`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        userId:
                            currentUserId

                    })

                }
            );

    }


    const data =
        await response.json();


    if (!response.ok) {

        alert(data.message);

        return;

    }


    liked =
        data.liked;


    document.getElementById(
        "likeCount"
    ).textContent =
        data.likeCount;


    updateButton();

}


// =====================================
// Update Like button text
// =====================================

function updateButton() {

    const button =
        document.getElementById(
            "like Button"
        );


    if (liked) {

        button.textContent =
            "❤️ Like Cancel";

    }

    else {

        button.textContent =
            "👍 Like";

    }

}


// =====================================
// Event listeners
// =====================================

document.getElementById(
    "loginButton"
).addEventListener(
    "click",
    login
);


document.getElementById(
    "likeButton"
).addEventListener(
    "click",
    toggleLike
);

</script>

</body>

</html>`
