<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        REST API Like Test
    </title>


    <style>

        body {

            font-family:
                Arial,
                sans-serif;

            max-width: 600px;

            margin: 40px auto;

            padding: 20px;

        }


        input {

            width: 250px;

            padding: 8px;

            margin: 5px 0;

        }


        button {

            padding: 8px 15px;

            margin: 5px;

            cursor: pointer;

        }


        .box {

            border: 1px solid #ccc;

            padding: 20px;

            margin-bottom: 20px;

        }


        .post {

            border: 1px solid #999;

            padding: 20px;

            margin-top: 20px;

        }


        #likeButton {

            font-size: 18px;

        }


        .message {

            margin-top: 10px;

            font-weight: bold;

        }

    </style>

</head>


<body>


<h1>
    REST API Like Test
</h1>


<!-- =================================
     Register
================================== -->

<div class="box">

    <h2>
        Register
    </h2>


    <input
        type="text"
        id="registerName"
        placeholder="Name"
    >

    <br>


    <input
        type="text"
        id="registerUsername"
        placeholder="Username"
    >

    <br>


    <input
        type="password"
        id="registerPassword"
        placeholder="Password"
    >

    <br>


    <button id="registerButton">

        Register

    </button>


    <div
        id="registerMessage"
        class="message"
    ></div>

</div>


<!-- =================================
     Login
================================== -->

<div class="box">

    <h2>
        Login
    </h2>


    <input
        type="text"
        id="loginUsername"
        placeholder="Username"
    >

    <br>


    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
    >

    <br>


    <button id="loginButton">

        Login

    </button>


    <button id="logoutButton">

        Logout

    </button>


    <p>

        Current User:

        <strong id="currentUser">

            Not logged in

        </strong>

    </p>


    <div
        id="loginMessage"
        class="message"
    ></div>

</div>


<!-- =================================
     Posts
================================== -->

<div class="post">

    <h2 id="postTitle">

        Delicious Pizza 🍕

    </h2>


    <button
        id="likeButton"
        disabled
    >

        👍 Like

    </button>


    <span>

        Like

        <strong id="likeCount">

            0

        </strong>

    </span>

</div>


<script>


// ======================================
// Basic settings
// ======================================

const postId = 1;


// Whether the current user has liked the post

let liked = false;


// ======================================
// Register
// ======================================

async function register() {

    const name =
        document.getElementById(
            "registerName"
        ).value.trim();


    const username =
        document.getElementById(
            "registerUsername"
        ).value.trim();


    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    const message =
        document.getElementById(
            "registerMessage"
        );


    // Confirm input

    if (
        !name ||
        !username ||
        !password
    ) {

        message.textContent =
            "Please fill in all fields.";

        return;

    }


    // Request server for registration

    const response =
        await fetch(
            "/api/register",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    name: name,

                    username: username,

                    password: password

                })

            }
        );


    const data =
        await response.json();


    message.textContent =
        data.message;


    // If registration is successful
    // Clear the input fields

    if (response.ok) {

        document.getElementById(
            "registerName"
        ).value = "";


        document.getElementById(
            "registerUsername"
        ).value = "";


        document.getElementById(
            "registerPassword"
        ).value = "";

    }

}


// ======================================
// Login
// ======================================

async function login() {

    const username =
        document.getElementById(
            "loginUsername"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    if (
        !username ||
        !password
    ) {

        message.textContent =
            "Please enter your username and password.";

        return;

    }


    // Request login

    const response =
        await fetch(
            "/api/login",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    username: username,

                    password: password

                })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        message.textContent =
            data.message;

        return;

    }


    message.textContent =
        "Login successful!";


    // Show current user

    document.getElementById(
        "currentUser"
    ).textContent =
        data.name;


    // Enable like button

    document.getElementById(
        "likeButton"
    ).disabled = false;


    // Reload post information

    loadPost();

}


// ======================================
// Logout
// ======================================

async function logout() {

    const response =
        await fetch(
            "/api/logout",
            {

                method: "POST"

            }
        );


    const data =
        await response.json();


    document.getElementById(
        "currentUser"
    ).textContent =
        "Not logged in";


    document.getElementById(
        "likeButton"
    ).disabled = true;


    document.getElementById(
        "loginMessage"
    ).textContent =
        data.message;


    liked = false;


    updateLikeButton();


    // Reload post information

    loadPost();

}


// ======================================
// Check Current Login User
// ======================================

async function checkLogin() {

    const response =
        await fetch(
            "/api/me"
        );


    if (!response.ok) {

        return;

    }


    const user =
        await response.json();


    document.getElementById(
        "currentUser"
    ).textContent =
        user.name;


    document.getElementById(
        "likeButton"
    ).disabled = false;


    loadPost();

}


// ======================================
// Load Post Information
// ======================================

async function loadPost() {

    const response =
        await fetch(
            `/api/posts/${postId}`
        );


    if (!response.ok) {

        return;

    }


    const data =
        await response.json();


    // Load post title

    document.getElementById(
        "postTitle"
    ).textContent =
        data.title;


    // Load like count

    document.getElementById(
        "likeCount"
    ).textContent =
        data.likeCount;


    // Whether the current user has liked the post

    liked =
        data.liked;


    updateLikeButton();

}


// ======================================
// Toggle Like / Unlike
// ======================================

async function toggleLike() {

    let response;


    // If already liked
    // DELETE

    if (liked) {

        response =
            await fetch(
                `/api/posts/${postId}/like`,
                {

                    method: "DELETE"

                }
            );

    }


    // If not liked
    // POST

    else {

        response =
            await fetch(
                `/api/posts/${postId}/like`,
                {

                    method: "POST"

                }
            );

    }


    const data =
        await response.json();


    if (!response.ok) {

        alert(data.message);

        return;

    }


    // Change like status

    liked =
        data.liked;


    // Change like count

    document.getElementById(
        "likeCount"
    ).textContent =
        data.likeCount;


    updateLikeButton();

}


// ======================================
// Update Like Button Display
// ======================================

function updateLikeButton() {

    const button =
        document.getElementById(
            "likeButton"
        );


    if (liked) {

        button.textContent =
            "❤️ Cancel Like";

    }

    else {

        button.textContent =
            "👍 Like";

    }

}


// ======================================
// Event Binding
// ======================================

document
    .getElementById(
        "registerButton"
    )
    .addEventListener(
        "click",
        register
    );


document
    .getElementById(
        "loginButton"
    )
    .addEventListener(
        "click",
        login
    );


document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        logout
    );


document
    .getElementById(
        "likeButton"
    )
    .addEventListener(
        "click",
        toggleLike
    );


// ======================================
// Page Load Event
// Check if the user is already logged in
// ======================================

checkLogin();

</script>


</body>

</html>
